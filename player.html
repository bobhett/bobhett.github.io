<!DOCTYPE html>
<audio controls id="clip1" src="EDM.jpg"></audio>
<button id="start">Start listening</button>
<div id="status">Not listening</div>
<script>
const TOPIC = "dance-continua-peak-to-peak-collab-34CB27D41E"; 

document.getElementById("start").onclick = () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  function action(msg) {
    const data = JSON.parse(msg.message); // Works fine
    html = `{"phoneId": ${data.phoneId}, "chipId": "${data.chipId}"}`;
    document.getElementById("status").innerHTML += html + "<br>";
    if (data.phoneId == 1) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    }
    else if (data.phoneId == 2) {
      document.getElementById("clip1").play();
    }
    else if (data.phoneId == 3) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 1200;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    }
  }

  const es = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);
  es.onopen = () => document.getElementById("status").innerHTML = "Listening...<br>";
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.event === "message") action(msg);
  };
  es.onerror = () => document.getElementById("status").textContent = "Connection issue, retrying...";
};
</script>
