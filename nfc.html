<script> 
var ndef = null;
try {
  ndef = new NDEFReader();
}
catch (e) {
  alert ("NFC not supported on this device/browser/OS.  Chrome on Android only.");
}

function scan() {
  document.getElementById("label").innerHTML = "Scanning...";
  document.getElementById("button").style.visibility="hidden";
  ndef.scan();
  ndef.onreading = event => {
    let html = `<p><strong>Records found:</strong> ${event.message.records.length}</p>`;
    
    event.message.records.forEach((record, index) => {
      html += `<p><strong>Record ${index}:</strong> ${record.recordType}</p>`;
      
        if (record.recordType === "text") {
          try {
            const decoder = new TextDecoder("utf-8");
            const text = decoder.decode(new Uint8Array(record.data.buffer, record.data.byteOffset, record.data.byteLength));
            html += `<p><strong>Text:</strong> ${text}</p>`;
          } catch (e) {
            html += `<p style="color: red;">Error decoding: ${e.message}</p>`;
          }
        } else if (record.recordType === "url") {
        try {
          const decoder = new TextDecoder("utf-8");
          const url = decoder.decode(record.data.buffer.slice(1));
          html += `<p><strong>URL:</strong> <a href="${url}">${url}</a></p>`;
        } catch (e) {
          html += `<p style="color: red;">Error decoding: ${e.message}</p>`;
        }
      } else {
        html += `<p><strong>Raw data:</strong> ${record.data}</p>`;
      }
    });
    document.getElementById("msg").innerHTML = html;
  }
}
</script>
<span id="label">NFC Tester</span>
<button onclick = "scan()" id="button">Scan</button>
<div style="border: 1px solid black; min-height: 3em" id="msg"></div>
