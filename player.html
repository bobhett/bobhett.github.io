<!DOCTYPE html>
<button id="start">Start listening</button>
<p id="status">Not listening</p>
<script>
const TOPIC = "dance-continua-peak-to-peak-collab-34CB27D41E"; 

document.getElementById("start").onclick = () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  function action(msg) {
    console.log(msg);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  }

  const es = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);
  es.onopen = () => document.getElementById("status").textContent = "Listening...";
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.event === "message") action(msg);
  };
  es.onerror = () => document.getElementById("status").textContent = "Connection issue, retrying...";
};
</script>
